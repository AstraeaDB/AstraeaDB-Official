[workspace]
members = [
    "crates/astraea-core",
    "crates/astraea-storage",
    "crates/astraea-graph",
    "crates/astraea-query",
    "crates/astraea-vector",
    "crates/astraea-server",
    "crates/astraea-flight",
    "crates/astraea-cli",
    "crates/astraea-rag",
    "crates/astraea-gnn",
    "crates/astraea-cluster",
    "crates/astraea-gpu",
    "crates/astraea-algorithms",
    "crates/astraea-encrypt-demo",
    "crates/astraea-mcp",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AstraeaDB/AstraeaDB-Official"

[workspace.dependencies]
# Internal crates. `version` is required for the crates that are published to
# crates.io (astraea-core/-storage/-vector/-graph/-rag); it is harmless for the
# rest, which build from `path` locally. Keep every version in lockstep with
# `[workspace.package].version` above.
astraea-core = { path = "crates/astraea-core", version = "0.3.1" }
astraea-storage = { path = "crates/astraea-storage", version = "0.3.1" }
astraea-graph = { path = "crates/astraea-graph", version = "0.3.1" }
astraea-query = { path = "crates/astraea-query", version = "0.3.1" }
astraea-vector = { path = "crates/astraea-vector", version = "0.3.1" }
astraea-server = { path = "crates/astraea-server", version = "0.3.1" }
astraea-gnn = { path = "crates/astraea-gnn", version = "0.3.1" }
astraea-rag = { path = "crates/astraea-rag", version = "0.3.1" }
astraea-cluster = { path = "crates/astraea-cluster", version = "0.3.1" }
astraea-gpu = { path = "crates/astraea-gpu", version = "0.3.1" }
astraea-algorithms = { path = "crates/astraea-algorithms", version = "0.3.1" }
astraea-encrypt-demo = { path = "crates/astraea-encrypt-demo", version = "0.3.1" }
astraea-mcp = { path = "crates/astraea-mcp", version = "0.3.1" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Error handling
thiserror = "2"

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Byte manipulation
bytes = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "6"

# Memory-mapped I/O
memmap2 = "0.9"

# Checksums
crc32fast = "1"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rustyline = "15"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Arrow / Flight / Parquet
arrow = { version = "59", features = ["prettyprint"] }
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
arrow-schema = "59"
parquet = "59"
futures = "0.3"

# Collections
smallvec = "1"
ordered-float = "4"

# Random
rand = "0.8"

# Object storage
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2"
x509-parser = "0.16"

# Dev dependencies
criterion = "0.5"
proptest = "1"
tempfile = "3"
rcgen = "0.13"
